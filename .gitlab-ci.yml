# GitLab CI: AI Daily Digest
# 在 GitLab UI 配置定时触发: Settings > CI/CD > Pipeline schedules
# 设置 cron: 0 22 * * * (UTC) = 北京时间 06:00

stages:
  - test
  - run

lint:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install py_compile
  script:
    - python -m py_compile src/main.py src/analyzer.py src/publisher.py src/processor.py src/config.py
    - find src/collectors -name "*.py" -exec python -m py_compile {} \;
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "master"

digest:
  stage: run
  image: python:3.11-slim
  cache:
    key: pip-cache
    paths:
      - .pip-cache/
  variables:
    PIP_CACHE_DIR: ".pip-cache"
  before_script:
    - pip install -r requirements.txt
  script:
    - python -m src.main
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"   # 定时触发
    - if: $CI_PIPELINE_SOURCE == "web"         # UI 手动触发
    - if: $CI_PIPELINE_SOURCE == "api"         # API 手动触发
    - when: manual                             # 其他情况允许手动运行
