# GitLab CI: AI Daily Digest
# 在 GitLab UI 配置定时触发: Settings > CI/CD > Pipeline schedules
# 设置 cron: 0 22 * * * (UTC) = 北京时间 06:00

stages:
  - test
  - run

lint:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install py_compile
  script:
    - python -m py_compile src/main.py src/analyzer.py src/publisher.py src/processor.py src/config.py
    - find src/collectors -name "*.py" -exec python -m py_compile {} \;
  only:
    - merge_requests
    - master
    - main

digest:
  stage: run
  image: python:3.11-slim
  cache:
    key: pip-cache
    paths:
      - .pip-cache/
  variables:
    PIP_CACHE_DIR: ".pip-cache"
  before_script:
    - pip install -r requirements.txt
  script:
    - python -m src.main
  only:
    - schedules
    - web
    - api
    - triggers
